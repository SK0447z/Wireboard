<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#09090b;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Top Navigation Bar -->
  <rect width="1200" height="48" fill="#0d0d10" stroke="#27272a" stroke-width="1" />
  <circle cx="28" cy="24" r="6" fill="#10b981" />
  <text x="44" y="28" fill="#f4f4f5" font-size="13" font-weight="700" letter-spacing="1">WIREBOARD</text>
  <rect x="150" y="12" width="260" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="162" y="28" fill="#a1a1aa" font-size="11">test-fixtures/broken-app</text>
  <rect x="420" y="12" width="60" height="24" rx="4" fill="#27272a" />
  <text x="436" y="28" fill="#f4f4f5" font-size="11">Scan</text>

  <!-- Score & Telemetry in Top Bar -->
  <text x="750" y="28" fill="#a1a1aa" font-size="11">Integrity Score:</text>
  <text x="845" y="28" fill="#ef4444" font-size="12" font-weight="700">25% (CRITICAL)</text>
  <text x="960" y="28" fill="#ef4444" font-size="11">3 BROKEN</text>
  <text x="1035" y="28" fill="#f59e0b" font-size="11">2 SUSPICIOUS</text>
  <text x="1125" y="28" fill="#10b981" font-size="11">1 VERIFIED</text>

  <!-- Column Headers -->
  <text x="80" y="85" fill="#71717a" font-size="11" font-weight="600" letter-spacing="1">FRONTEND COMPONENTS</text>
  <text x="450" y="85" fill="#71717a" font-size="11" font-weight="600" letter-spacing="1">BACKEND API ROUTES</text>
  <text x="820" y="85" fill="#71717a" font-size="11" font-weight="600" letter-spacing="1">DATABASE SCHEMAS</text>

  <!-- WIRES (Edges) -->
  <!-- Broken Wire 1: RegisterForm -> POST /api/register (Red) -->
  <path d="M 330 160 C 390 160, 390 160, 450 160" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow-rose)" />
  <!-- Broken Wire 2: POST /api/register -> db:User (Red) -->
  <path d="M 700 160 C 760 160, 760 160, 820 160" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow-rose)" />
  <!-- Verified Wire: ProjectList -> GET /api/projects (Green) -->
  <path d="M 330 360 C 390 360, 390 330, 450 330" fill="none" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
  <!-- Suspicious Wire: POST /api/projects -> db:Project (Yellow) -->
  <path d="M 700 480 C 760 480, 760 360, 820 360" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" filter="url(#glow-amber)" />
  <!-- Broken Wire 3: ProjectList -> DELETE /api/v1/projects/delete (Red) -->
  <path d="M 330 400 C 390 400, 390 560, 450 560" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow-rose)" />

  <!-- NODES -->
  <!-- Node 1: fe:RegisterForm.tsx -->
  <g transform="translate(80, 110)">
    <rect width="250" height="100" rx="6" fill="#111114" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#a1a1aa" font-size="9" font-weight="700">FRONTEND</text>
    <circle cx="236" cy="14" r="3.5" fill="#ef4444" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">RegisterForm.tsx</text>
    <text x="12" y="70" fill="#71717a" font-size="10">app/register/RegisterForm.tsx:5</text>
    <text x="12" y="88" fill="#ef4444" font-size="9">expects: userId, sessionToken</text>
  </g>

  <!-- Node 2: api:POST:/api/register -->
  <g transform="translate(450, 110)">
    <rect width="250" height="100" rx="6" fill="#111114" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#f4f4f5" font-size="9" font-weight="700">POST</text>
    <text x="45" y="18" fill="#a1a1aa" font-size="9">/api/register</text>
    <circle cx="236" cy="14" r="3.5" fill="#ef4444" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">POST /api/register</text>
    <text x="12" y="70" fill="#71717a" font-size="10">app/api/register/route.ts:15</text>
    <text x="12" y="88" fill="#f59e0b" font-size="9">ENV_DRIFT: JWT_SIGNING_KEY</text>
  </g>

  <!-- Node 3: db:User -->
  <g transform="translate(820, 110)">
    <rect width="250" height="100" rx="6" fill="#111114" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#a1a1aa" font-size="9" font-weight="700">PRISMA MODEL</text>
    <circle cx="236" cy="14" r="3.5" fill="#ef4444" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">User</text>
    <text x="12" y="70" fill="#71717a" font-size="10">prisma/schema.prisma:10</text>
    <text x="12" y="88" fill="#71717a" font-size="9">cols: id, email, subscription_tier</text>
  </g>

  <!-- Node 4: fe:ProjectList.tsx -->
  <g transform="translate(80, 320)">
    <rect width="250" height="110" rx="6" fill="#111114" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#a1a1aa" font-size="9" font-weight="700">FRONTEND</text>
    <circle cx="236" cy="14" r="3.5" fill="#ef4444" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">ProjectList.tsx</text>
    <text x="12" y="70" fill="#71717a" font-size="10">app/dashboard/ProjectList.tsx:11</text>
    <text x="12" y="90" fill="#10b981" font-size="9">calls: GET /api/projects</text>
    <text x="12" y="102" fill="#ef4444" font-size="9">calls: DELETE /api/v1/projects/delete</text>
  </g>

  <!-- Node 5: api:GET:/api/projects -->
  <g transform="translate(450, 280)">
    <rect width="250" height="90" rx="6" fill="#111114" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#10b981" font-size="9" font-weight="700">GET</text>
    <text x="40" y="18" fill="#a1a1aa" font-size="9">/api/projects</text>
    <circle cx="236" cy="14" r="3.5" fill="#10b981" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">GET /api/projects</text>
    <text x="12" y="70" fill="#71717a" font-size="10">app/api/projects/route.ts:17</text>
  </g>

  <!-- Node 6: api:POST:/api/projects -->
  <g transform="translate(450, 420)">
    <rect width="250" height="90" rx="6" fill="#111114" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#f59e0b" font-size="9" font-weight="700">POST</text>
    <text x="45" y="18" fill="#a1a1aa" font-size="9">/api/projects</text>
    <circle cx="236" cy="14" r="3.5" fill="#f59e0b" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">POST /api/projects</text>
    <text x="12" y="70" fill="#71717a" font-size="10">app/api/projects/route.ts:25</text>
  </g>

  <!-- Node 7: db:Project -->
  <g transform="translate(820, 310)">
    <rect width="250" height="100" rx="6" fill="#111114" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#18181b" />
    <text x="12" y="18" fill="#a1a1aa" font-size="9" font-weight="700">PRISMA MODEL</text>
    <circle cx="236" cy="14" r="3.5" fill="#f59e0b" />
    <text x="12" y="50" fill="#f4f4f5" font-size="12" font-weight="600">Project</text>
    <text x="12" y="70" fill="#71717a" font-size="10">prisma/schema.prisma:22</text>
    <text x="12" y="88" fill="#71717a" font-size="9">cols: id, title, user_id</text>
  </g>

  <!-- Node 8: Missing route placeholder -->
  <g transform="translate(450, 530)">
    <rect width="250" height="80" rx="6" fill="#18181b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="12" y="24" fill="#ef4444" font-size="9" font-weight="700">MISSING ROUTE</text>
    <text x="12" y="48" fill="#f4f4f5" font-size="11">DELETE /api/v1/projects/delete</text>
    <text x="12" y="68" fill="#ef4444" font-size="9">404 at runtime</text>
  </g>
</svg>
